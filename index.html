<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Ubicaciones – CABA (24 puntos)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    header {
      background: #2968c8;
      color: #fff;
      padding: 12px 20px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .badge {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .layout { display: flex; height: calc(100vh - 48px); }
    .sidebar {
      width: 340px;
      padding: 16px;
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #e1e4ea;
    }
    #map { flex: 1; min-height: 400px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }
    .field input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd2dc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: #2968c8;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
    button:hover { background: #1f4fa0; }
    button.secondary { background: #8e44ad; margin-top: 10px; }
    button.secondary:hover { background: #6f3290; }
    .result {
      margin-top: 18px;
      padding: 12px;
      background: #f7f9fc;
      border: 1px solid #e1e4ea;
      border-radius: 8px;
      font-size: 14px;
    }
    .result .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #e1e4ea;
    }
    .result .row:last-child { border-bottom: none; }
    .result .k { color: #666; }
    .result .v { font-weight: 600; text-align: right; max-width: 60%; }
    .checks {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .checks label { display: flex; align-items: center; gap: 6px; }
    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }
    .counter {
      margin-top: 12px;
      padding: 10px;
      background: #eef3fb;
      border-radius: 8px;
      font-size: 13px;
      color: #2968c8;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <span>Buscador de Ubicaciones – CABA</span>
  <span class="badge" id="badgeTotal">Puntos: 24 · Regiones: 24</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="field">
      <label for="searchInput">Dirección</label>
      <input
        type="text"
        id="searchInput"
        placeholder="Ej: Av. Corrientes 1000"
        onkeydown="if(event.key==='Enter') buscarUbicacion()"
      />
    </div>

    <button onclick="buscarUbicacion()">🔍 Buscar</button>

    <div class="result">
      <div class="row"><span class="k">Dirección</span><span class="v" id="valDireccion">-</span></div>
      <div class="row"><span class="k">Punto cercano</span><span class="v" id="valPunto">-</span></div>
      <div class="row"><span class="k">Distancia</span><span class="v" id="valDistancia">-</span></div>
    </div>

    <div class="checks">
      <label><input type="checkbox" id="chkRegiones" checked onchange="refrescarVista()" /> Ver regiones</label>
      <label><input type="checkbox" id="chkBordes"   checked onchange="refrescarVista()" /> Ver bordes</label>
    </div>

    <div class="counter" id="contadorVoronoi">24 puntos · 24 regiones Voronoi</div>

    <div class="hint">
      Se muestran las 24 regiones de Voronoi (una por punto). Buscá una dirección para resaltar la región correspondiente.
    </div>
  </aside>

  <div id="map"></div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const PROXY_URL = 'https://nominatim-proxy.onrender.com';

/* ============================================================
   MAPA Y CAPAS
   ============================================================ */
const map = L.map('map').setView([-34.6158, -58.4333], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const capaVoronoi = L.layerGroup().addTo(map);
const capaPuntos  = L.layerGroup().addTo(map);

let marcadorBusqueda = null;
let limiteCABA       = null;
let selectedLayer    = null;
let ultimoPuntoId    = null;

/* ============================================================
   24 PUNTOS DE REFERENCIA
   ------------------------------------------------------------
   → Los primeros 22 son barrios base de CABA (reemplazalos por
     tus puntos reales si tenés otros).
   → Los últimos 2 son las direcciones nuevas.
   ============================================================ */
const puntosDatos = [
  { id: 'p01', nombre: 'Retiro',                lat: -34.5895, lng: -58.3745 },
  { id: 'p02', nombre: 'Recoleta',              lat: -34.5880, lng: -58.3970 },
  { id: 'p03', nombre: 'Palermo',               lat: -34.5780, lng: -58.4250 },
  { id: 'p04', nombre: 'Belgrano',              lat: -34.5620, lng: -58.4570 },
  { id: 'p05', nombre: 'Núñez',                 lat: -34.5450, lng: -58.4630 },
  { id: 'p06', nombre: 'Colegiales',            lat: -34.5730, lng: -58.4480 },
  { id: 'p07', nombre: 'Villa Urquiza',         lat: -34.5730, lng: -58.4870 },
  { id: 'p08', nombre: 'Villa Devoto',          lat: -34.6030, lng: -58.5140 },
  { id: 'p09', nombre: 'Villa del Parque',      lat: -34.6020, lng: -58.4930 },
  { id: 'p10', nombre: 'Agronomía',             lat: -34.5960, lng: -58.4900 },
  { id: 'p11', nombre: 'Caballito',             lat: -34.6200, lng: -58.4450 },
  { id: 'p12', nombre: 'Villa Crespo',          lat: -34.5980, lng: -58.4420 },
  { id: 'p13', nombre: 'Almagro',               lat: -34.6080, lng: -58.4220 },
  { id: 'p14', nombre: 'Balvanera (Once)',      lat: -34.6080, lng: -58.4100 },
  { id: 'p15', nombre: 'San Nicolás',           lat: -34.6050, lng: -58.3880 },
  { id: 'p16', nombre: 'Monserrat',             lat: -34.6120, lng: -58.3830 },
  { id: 'p17', nombre: 'San Telmo',             lat: -34.6200, lng: -58.3730 },
  { id: 'p18', nombre: 'La Boca',               lat: -34.6350, lng: -58.3620 },
  { id: 'p19', nombre: 'Barracas',              lat: -34.6400, lng: -58.3800 },
  { id: 'p20', nombre: 'Parque Patricios',      lat: -34.6400, lng: -58.4050 },
  { id: 'p21', nombre: 'Nueva Pompeya',         lat: -34.6500, lng: -58.4200 },
  { id: 'p22', nombre: 'Flores',                lat: -34.6300, lng: -58.4650 },
  { id: 'n01', nombre: 'Villa 31 – Manzana 33 Casa 14', lat: -34.58150, lng: -58.37550 },
  { id: 'n02', nombre: 'Gavilán 1245',         lat: -34.60150, lng: -58.44050 }
];

const poligonosReferencia = {};


async function geocodificarDireccion(dir) {
  const q = /argentina|caba|aut[óo]noma/i.test(dir)
    ? dir : `${dir}, CABA, Argentina`;

  const res = await fetch(`${PROXY_URL}/geocode?q=${encodeURIComponent(q)}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data) || data.length === 0) throw new Error('sin resultados');
  return {
    lat: parseFloat(data[0].lat),
    lng: parseFloat(data[0].lon),
    display: data[0].display_name
  };
}


async function buscarUbicacion() {
  const input = document.getElementById('searchInput').value.trim();
  if (!input) return;

  document.getElementById('valDireccion').innerText = 'Buscando...';
  document.getElementById('valPunto').innerText = '-';
  document.getElementById('valDistancia').innerText = '-';

  const url = `${PROXY_URL}/geocode?q=${encodeURIComponent(input + ', CABA, Argentina')}`;

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
    const data = await response.json();

    if (data && data.length > 0) {
      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);

      if (marcadorBusqueda) map.removeLayer(marcadorBusqueda);

      marcadorBusqueda = L.circleMarker([lat, lng], {
        radius: 7, fillColor: '#e74c3c', color: '#c0392b',
        weight: 2, fillOpacity: 1
      }).addTo(map).bindPopup('<b>Ubicación Encontrada</b>').openPopup();

      map.setView([lat, lng], 14);

      const ptBuscado = turf.point([lng, lat]);
      let puntoCercano = null;
      let distMin = Infinity;

      puntosDatos.forEach(p => {
        const ptRef = turf.point([p.lng, p.lat]);
        const d = turf.distance(ptBuscado, ptRef, { units: 'kilometers' });
        if (d < distMin) { distMin = d; puntoCercano = p; }
      });

      document.getElementById('valDireccion').innerText =
        data[0].display_name.split(',').slice(0, 2).join(', ');
      document.getElementById('valPunto').innerText = puntoCercano.nombre;
      document.getElementById('valDistancia').innerText = `${distMin.toFixed(2)} km`;

      ultimoPuntoId = puntoCercano.id;
      aplicarSeleccion(puntoCercano.id);

    } else {
      document.getElementById('valDireccion').innerText = 'No encontrada';
      alert('No se encontró la dirección en Capital Federal.');
    }
  } catch (error) {
    console.error('Error técnico detectado:', error);
    document.getElementById('valDireccion').innerText = 'Error de red';
    alert('Error de conexión con el servicio de búsqueda. Intentá de nuevo en unos segundos.');
  }
}


function aplicarSeleccion(puntoId) {
  const verRegiones = document.getElementById('chkRegiones').checked;
  const verBordes   = document.getElementById('chkBordes').checked;

  if (selectedLayer) {
    selectedLayer.setStyle({
      weight: verBordes ? 2 : 0,
      color: '#ffffff',
      fillOpacity: verRegiones ? 0.7 : 0,
      opacity: verBordes ? 1 : 0
    });
    selectedLayer = null;
  }

  const nueva = poligonosReferencia[puntoId];
  if (nueva && verRegiones) {
    nueva.setStyle({ weight: 4, color: '#2968c8', fillOpacity: 0.9, opacity: 1 });
    nueva.bringToFront();
    selectedLayer = nueva;
  }

  capaPuntos.bringToFront();
  if (marcadorBusqueda) marcadorBusqueda.bringToFront();
}

function refrescarVista() {
  if (ultimoPuntoId && poligonosReferencia[ultimoPuntoId]) {
    aplicarSeleccion(ultimoPuntoId);
  } else {
    const verRegiones = document.getElementById('chkRegiones').checked;
    const verBordes   = document.getElementById('chkBordes').checked;
    Object.values(poligonosReferencia).forEach(layer => {
      layer.setStyle({
        weight: verBordes ? 2 : 0,
        fillOpacity: verRegiones ? 0.7 : 0,
        opacity: verBordes ? 1 : 0
      });
    });
  }
}


function intersectar(a, b) {
  try {
    return turf.intersect(turf.featureCollection([a, b])); // Turf v7
  } catch (e) {
    return turf.intersect(a, b);                            // Turf v6
  }
}

const PALETA = [
  '#2968c8','#e67e22','#16a085','#8e44ad','#c0392b','#2c3e50',
  '#d35400','#27ae60','#2980b9','#f39c12','#7f8c8d','#c2185b',
  '#00838f','#5d4037','#455a64','#6a1b9a','#ef6c00','#00695c',
  '#283593','#ad1457','#4e342e','#33691e','#0277bd','#bf360c'
];

function colorDePunto(id) {
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
  return PALETA[h % PALETA.length];
}

function recalcularVoronoi() {
  if (!limiteCABA) {
    console.error('Falta el polígono límite de CABA (limiteCABA).');
    return;
  }
  if (puntosDatos.length < 2) return;

  Object.keys(poligonosReferencia).forEach(k => {
    const capa = poligonosReferencia[k];
    if (capa && capa.remove) capa.remove();
    delete poligonosReferencia[k];
  });
  selectedLayer = null;

  const puntosFC = turf.featureCollection(
    puntosDatos.map(p => turf.point([p.lng, p.lat], { id: p.id, nombre: p.nombre }))
  );

  // 3. Voronoi dentro de la bbox de CABA
  const bbox = turf.bbox(limiteCABA);
  const voronoi = turf.voronoi(puntosFC, { bbox });
  if (!voronoi || !voronoi.features) {
    console.warn('Voronoi vacío.');
    return;
  }

  // 4. Recortar cada celda contra CABA
  let creadas = 0;

  voronoi.features.forEach(celda => {
    if (!celda) return;

    let recorte;
    try {
      recorte = intersectar(celda, limiteCABA);
    } catch (e) {
      console.warn('Error al intersectar celda con CABA:', e);
      return;
    }
    if (!recorte) return;

    // ¿A qué punto pertenece esta celda?
    let dueno = puntosDatos.find(p =>
      turf.booleanPointInPolygon(turf.point([p.lng, p.lat]), recorte)
    );

    if (!dueno) {
      const c = turf.centroid(recorte);
      let best = null, bestD = Infinity;
      puntosDatos.forEach(p => {
        const d = turf.distance(c, turf.point([p.lng, p.lat]));
        if (d < bestD) { bestD = d; best = p; }
      });
      dueno = best;
    }
    if (!dueno) return;

    const layer = L.geoJSON(recorte, {
      style: {
        weight: 0,
        color: '#ffffff',
        fillColor: colorDePunto(dueno.id),
        fillOpacity: 0,
        opacity: 0
      }
    }).addTo(capaVoronoi);

    poligonosReferencia[dueno.id] = layer;
    creadas++;
  });

  console.log(`Voronoi generado: ${puntosDatos.length} puntos → ${creadas} regiones.`);

  actualizarContador(creadas);

  // 5. Restaurar selección o mostrar todo
  if (ultimoPuntoId && poligonosReferencia[ultimoPuntoId]) {
    aplicarSeleccion(ultimoPuntoId);
  } else {
    refrescarVista();
  }
}

function actualizarContador(regiones) {
  const txt = `${puntosDatos.length} puntos · ${regiones} regiones Voronoi`;
  document.getElementById('contadorVoronoi').innerText = txt;
  document.getElementById('badgeTotal').innerText =
    `Puntos: ${puntosDatos.length} · Regiones: ${regiones}`;
}


function dibujarPuntos() {
  capaPuntos.clearLayers();

  puntosDatos.forEach(p => {
    const esNuevo = p.id.startsWith('n');
    L.circleMarker([p.lat, p.lng], {
      radius: esNuevo ? 7 : 6,
      fillColor: esNuevo ? '#8e44ad' : colorDePunto(p.id),
      color: '#ffffff',
      weight: 2,
      fillOpacity: 1
    })
      .addTo(capaPuntos)
      .bindPopup(
        `<b>${p.nombre}</b><br>` +
        `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}` +
        (esNuevo ? '<br><i>Punto nuevo</i>' : '')
      );
  });
}


async function cargarLimiteCABA() {
  const url = 'https://raw.githubusercontent.com/martgnz/buenos-aires-geojson/master/barrios.geojson';

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const features = data.features || [];
    let union = null;

    features.forEach(f => {
      try {
        union = union ? turf.union(union, f) : f;
      } catch (e) { /* ignorar */ }
    });

    if (!union) throw new Error('No se pudo unir barrios.');
    limiteCABA = union;

    L.geoJSON(limiteCABA, {
      style: { color: '#333', weight: 1.5, fill: false, opacity: 0.6 },
      interactive: false
    }).addTo(map);

    map.fitBounds(L.geoJSON(limiteCABA).getBounds(), { padding: [20, 20] });

    dibujarPuntos();
    recalcularVoronoi();

  } catch (err) {
    console.error('Error al cargar límite de CABA:', err);
    alert('No se pudo cargar el límite de CABA. Verificá tu conexión o cambiá la URL del GeoJSON.');
  }
}

window.addEventListener('load', cargarLimiteCABA);
</script>

</body>
</html>
