<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscador de Ubicaciones – CABA</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf.js -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    header {
      background: #2968c8;
      color: #fff;
      padding: 12px 20px;
      font-weight: 600;
    }
    .layout {
      display: flex;
      height: calc(100vh - 48px);
    }
    .sidebar {
      width: 340px;
      padding: 16px;
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #e1e4ea;
    }
    #map {
      flex: 1;
      min-height: 400px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }
    .field input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd2dc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: #2968c8;
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
    button:hover { background: #1f4fa0; }
    button.secondary {
      background: #8e44ad;
      margin-top: 10px;
    }
    button.secondary:hover { background: #6f3290; }
    .result {
      margin-top: 18px;
      padding: 12px;
      background: #f7f9fc;
      border: 1px solid #e1e4ea;
      border-radius: 8px;
      font-size: 14px;
    }
    .result .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #e1e4ea;
    }
    .result .row:last-child { border-bottom: none; }
    .result .k { color: #666; }
    .result .v { font-weight: 600; text-align: right; max-width: 60%; }
    .checks {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
    }
    .checks label { display: flex; align-items: center; gap: 6px; }
    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<header>Buscador de Ubicaciones – CABA</header>

<div class="layout">
  <aside class="sidebar">
    <div class="field">
      <label for="searchInput">Dirección</label>
      <input
        type="text"
        id="searchInput"
        placeholder="Ej: Av. Corrientes 1000"
        onkeydown="if(event.key==='Enter') buscarUbicacion()"
      />
    </div>

    <button onclick="buscarUbicacion()">🔍 Buscar</button>

    <div class="result">
      <div class="row"><span class="k">Dirección</span><span class="v" id="valDireccion">-</span></div>
      <div class="row"><span class="k">Punto cercano</span><span class="v" id="valPunto">-</span></div>
      <div class="row"><span class="k">Distancia</span><span class="v" id="valDistancia">-</span></div>
    </div>

    <div class="checks">
      <label><input type="checkbox" id="chkRegiones" checked onchange="refrescarVista()" /> Ver regiones</label>
      <label><input type="checkbox" id="chkBordes" checked onchange="refrescarVista()" /> Ver bordes</label>
    </div>

    <button class="secondary" onclick="agregarPuntosVoronoi()">
      ➕ Agregar puntos y recalcular Voronoi
    </button>

    <div class="hint">
      Agrega <b>Villa 31 (Manzana 33 Casa 14)</b> y <b>Gavilán 1245</b> y recalcula todo el diagrama de Voronoi sobre CABA.
    </div>
  </aside>

  <div id="map"></div>
</div>

<script>


const PROXY_URL = 'https://nominatim-proxy.onrender.com';


const map = L.map('map').setView([-34.6158, -58.4333], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const capaVoronoi = L.layerGroup().addTo(map);

const capaPuntos = L.layerGroup().addTo(map);

let marcadorBusqueda = null;

let limiteCABA = null;

let selectedLayer = null;
let ultimoPuntoId = null;


 */
const puntosDatos = [
  { id: 'p1', nombre: 'Retiro',            lat: -34.5895, lng: -58.3745 },
  { id: 'p2', nombre: 'Recoleta',          lat: -34.5880, lng: -58.3970 },
  { id: 'p3', nombre: 'Palermo',           lat: -34.5780, lng: -58.4250 },
  { id: 'p4', nombre: 'Belgrano',          lat: -34.5620, lng: -58.4570 },
  { id: 'p5', nombre: 'Caballito',         lat: -34.6200, lng: -58.4450 },
  { id: 'p6', nombre: 'Flores',            lat: -34.6300, lng: -58.4650 },
  { id: 'p7', nombre: 'Villa Lugano',      lat: -34.6700, lng: -58.4800 },
  { id: 'p8', nombre: 'La Boca',           lat: -34.6350, lng: -58.3620 },
  { id: 'p9', nombre: 'San Telmo',         lat: -34.6200, lng: -58.3730 },
  { id: 'p10', nombre: 'Once',             lat: -34.6080, lng: -58.4100 }
];

const poligonosReferencia = {};



const NUEVAS_DIRECCIONES = [
  {
    dir: 'Manzana 33 Casa 14, Av. Pres. Ramón Villa 31, Ciudad Autónoma de Buenos Aires',
    nombre: 'Villa 31 – Manzana 33 Casa 14',
    fallback: { lat: -34.58150, lng: -58.37550 }
  },
  {
    dir: 'Gavilán 1245, C1416 Ciudad Autónoma de Buenos Aires',
    nombre: 'Gavilán 1245',
    fallback: { lat: -34.60150, lng: -58.44050 }
  }
];



async function geocodificarDireccion(dir) {
  const q = /argentina|caba|aut[óo]noma/i.test(dir)
    ? dir
    : `${dir}, CABA, Argentina`;

  const res = await fetch(`${PROXY_URL}/geocode?q=${encodeURIComponent(q)}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);

  const data = await res.json();
  if (!Array.isArray(data) || data.length === 0) throw new Error('sin resultados');

  return {
    lat: parseFloat(data[0].lat),
    lng: parseFloat(data[0].lon),
    display: data[0].display_name
  };
}



async function buscarUbicacion() {
  const input = document.getElementById('searchInput').value.trim();
  if (!input) return;

  document.getElementById('valDireccion').innerText = 'Buscando...';
  document.getElementById('valPunto').innerText = '-';
  document.getElementById('valDistancia').innerText = '-';

  const query = input + ', CABA, Argentina';
  const url = `${PROXY_URL}/geocode?q=${encodeURIComponent(query)}`;

  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
    const data = await response.json();

    if (data && data.length > 0) {
      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);

      if (marcadorBusqueda) map.removeLayer(marcadorBusqueda);

      marcadorBusqueda = L.circleMarker([lat, lng], {
        radius: 7,
        fillColor: '#e74c3c',
        color: '#c0392b',
        weight: 2,
        fillOpacity: 1
      }).addTo(map).bindPopup('<b>Ubicación Encontrada</b>').openPopup();

      map.setView([lat, lng], 14);

      const ptBuscado = turf.point([lng, lat]);
      let puntoCercano = null;
      let distMin = Infinity;

      puntosDatos.forEach(p => {
        const ptRef = turf.point([p.lng, p.lat]);
        const d = turf.distance(ptBuscado, ptRef, { units: 'kilometers' });
        if (d < distMin) { distMin = d; puntoCercano = p; }
      });

      if (!puntoCercano) {
        document.getElementById('valDireccion').innerText = 'Sin puntos de referencia';
        return;
      }

      document.getElementById('valDireccion').innerText =
        data[0].display_name.split(',').slice(0, 2).join(', ');
      document.getElementById('valPunto').innerText = puntoCercano.nombre.split(',')[0];
      document.getElementById('valDistancia').innerText = `${distMin.toFixed(2)} km`;

      // Guardamos el id para reaplicar selección después de recalcular
      ultimoPuntoId = puntoCercano.id;

      aplicarSeleccion(puntoCercano.id);
    } else {
      document.getElementById('valDireccion').innerText = 'No encontrada';
      alert('No se encontró la dirección en Capital Federal.');
    }
  } catch (error) {
    console.error('Error técnico detectado:', error);
    document.getElementById('valDireccion').innerText = 'Error de red';
    alert('Error de conexión con el servicio de búsqueda. Intentá de nuevo en unos segundos.');
  }
}



function aplicarSeleccion(puntoId) {
  const verRegiones = document.getElementById('chkRegiones').checked;
  const verBordes   = document.getElementById('chkBordes').checked;

  // Restaurar estilo del anterior
  if (selectedLayer) {
    selectedLayer.setStyle({
      weight: verBordes ? 2 : 0,
      color: '#ffffff',
      fillOpacity: verRegiones ? 0.7 : 0,
      opacity: verBordes ? 1 : 0
    });
    selectedLayer = null;
  }

  const nueva = poligonosReferencia[puntoId];
  if (nueva && verRegiones) {
    nueva.setStyle({ weight: 4, color: '#2968c8', fillOpacity: 0.9, opacity: 1 });
    nueva.bringToFront();
    selectedLayer = nueva;
  }

  capaPuntos.bringToFront();
  if (marcadorBusqueda) marcadorBusqueda.bringToFront();
}

function refrescarVista() {
  if (ultimoPuntoId) {
    aplicarSeleccion(ultimoPuntoId);
  } else {
    // Solo actualizar visibilidad general
    const verRegiones = document.getElementById('chkRegiones').checked;
    const verBordes   = document.getElementById('chkBordes').checked;
    Object.values(poligonosReferencia).forEach(layer => {
      layer.setStyle({
        weight: verBordes ? 2 : 0,
        fillOpacity: verRegiones ? 0.7 : 0,
        opacity: verBordes ? 1 : 0
      });
    });
  }
}



function intersectar(a, b) {
  try {
    return turf.intersect(turf.featureCollection([a, b])); 
  } catch (e) {
    return turf.intersect(a, b);                            
  }
}

const PALETA = ['#2968c8', '#e67e22', '#16a085', '#8e44ad',
                '#c0392b', '#2c3e50', '#d35400', '#27ae60',
                '#2980b9', '#f39c12'];

function colorDePunto(id) {
  let h = 0;
  const s = String(id);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
  return PALETA[h % PALETA.length];
}

function recalcularVoronoi() {
  if (!limiteCABA) {
    console.error('Falta el polígono límite de CABA (limiteCABA).');
    return;
  }
  if (puntosDatos.length < 2) return;

  // 1. Borrar polígonos anteriores
  Object.keys(poligonosReferencia).forEach(k => {
    const capa = poligonosReferencia[k];
    if (capa && capa.remove) capa.remove();
    delete poligonosReferencia[k];
  });
  selectedLayer = null;

  // 2. FeatureCollection de puntos
  const puntosFC = turf.featureCollection(
    puntosDatos.map(p => turf.point([p.lng, p.lat], { id: p.id, nombre: p.nombre }))
  );

  // 3. Voronoi dentro de la bbox de CABA
  const bbox = turf.bbox(limiteCABA);
  const voronoi = turf.voronoi(puntosFC, { bbox });
  if (!voronoi || !voronoi.features) {
    console.warn('Voronoi vacío.');
    return;
  }

  // 4. Recortar cada celda contra CABA
  voronoi.features.forEach(celda => {
    if (!celda) return;

    let recorte;
    try {
      recorte = intersectar(celda, limiteCABA);
    } catch (e) {
      console.warn('Error al intersectar celda con CABA:', e);
      return;
    }
    if (!recorte) return;

    // ¿A qué punto pertenece?
    let dueno = puntosDatos.find(p =>
      turf.booleanPointInPolygon(turf.point([p.lng, p.lat]), recorte)
    );

    if (!dueno) {
      const c = turf.centroid(recorte);
      let best = null, bestD = Infinity;
      puntosDatos.forEach(p => {
        const d = turf.distance(c, turf.point([p.lng, p.lat]));
        if (d < bestD) { bestD = d; best = p; }
      });
      dueno = best;
    }
    if (!dueno) return;

    const layer = L.geoJSON(recorte, {
      style: {
        weight: 0,
        color: '#ffffff',
        fillColor: colorDePunto(dueno.id),
        fillOpacity: 0,
        opacity: 0
      }
    }).addTo(capaVoronoi);

    poligonosReferencia[dueno.id] = layer;
  });

  // 5. Restaurar selección si había una búsqueda activa
  if (ultimoPuntoId && poligonosReferencia[ultimoPuntoId]) {
    aplicarSeleccion(ultimoPuntoId);
  } else {
    refrescarVista();
  }
}



async function agregarPuntosVoronoi(lista = NUEVAS_DIRECCIONES) {
  const nuevos = [];

  for (const item of lista) {
    // Evitar duplicados por nombre
    if (puntosDatos.some(p => p.nombre === item.nombre)) {
      console.info(`Ya existe: ${item.nombre}`);
      continue;
    }

    let coords = null;
    let fuente = 'Nominatim';

    try {
      coords = await geocodificarDireccion(item.dir);
    } catch (err) {
      console.warn(`Geocoding falló para "${item.dir}":`, err.message);
      if (item.fallback) {
        coords = item.fallback;
        fuente = 'coordenada aproximada';
      }
    }
    if (!coords) {
      console.error(`Se omite "${item.dir}" (sin coordenadas).`);
      continue;
    }

    const punto = {
      id: `nuevo-${puntosDatos.length}-${Date.now()}`,
      nombre: item.nombre,
      lat: coords.lat,
      lng: coords.lng,
      fuente
    };

    puntosDatos.push(punto);
    nuevos.push(punto);

    L.circleMarker([punto.lat, punto.lng], {
      radius: 7,
      fillColor: '#8e44ad',
      color: '#ffffff',
      weight: 2,
      fillOpacity: 1
    })
      .addTo(capaPuntos)
      .bindPopup(
        `<b>${punto.nombre}</b><br>` +
        `${punto.lat.toFixed(5)}, ${punto.lng.toFixed(5)}<br>` +
        `<i>${fuente}</i>`
      );

    console.log(`✔ ${punto.nombre} → ${punto.lat}, ${punto.lng} (${fuente})`);

    // Pausa para respetar rate limit de Nominatim
    await new Promise(r => setTimeout(r, 1100));
  }

  if (nuevos.length === 0) {
    alert('No se agregó ningún punto nuevo.');
    return;
  }

  recalcularVoronoi();

  if (capaPuntos.getBounds().isValid()) {
    map.fitBounds(capaPuntos.getBounds(), { padding: [40, 40] });
  }

  alert(`Se agregaron ${nuevos.length} punto(s) y se recalculó el Voronoi.`);
}



function dibujarPuntosIniciales() {
  capaPuntos.clearLayers();

  puntosDatos.forEach(p => {
    L.circleMarker([p.lat, p.lng], {
      radius: 6,
      fillColor: colorDePunto(p.id),
      color: '#ffffff',
      weight: 2,
      fillOpacity: 1
    })
      .addTo(capaPuntos)
      .bindPopup(
        `<b>${p.nombre}</b><br>` +
        `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`
      );
  });
}



async function cargarLimiteCABA() {
  // GeoJSON simplificado de la Ciudad de Buenos Aires.
  // Si tenés tu propio archivo, reemplazá esta URL.
  const url = 'https://raw.githubusercontent.com/martgnz/buenos-aires-geojson/master/barrios.geojson';

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Unificar todos los barrios en un solo polígono (MultiPolygon)
    const features = data.features || [];
    let union = null;

    features.forEach(f => {
      try {
        union = union ? turf.union(union, f) : f;
      } catch (e) {
        // Ignorar geometrías problemáticas
      }
    });

    if (!union) throw new Error('No se pudo unir barrios.');

    limiteCABA = union;

    // Dibujar límite suave
    L.geoJSON(limiteCABA, {
      style: {
        color: '#333',
        weight: 1.5,
        fill: false,
        opacity: 0.6
      },
      interactive: false
    }).addTo(map);

    map.fitBounds(L.geoJSON(limiteCABA).getBounds(), { padding: [20, 20] });

    // Ahora sí: dibujar puntos y calcular Voronoi
    dibujarPuntosIniciales();
    recalcularVoronoi();

  } catch (err) {
    console.error('Error al cargar límite de CABA:', err);
    alert('No se pudo cargar el límite de CABA. Verificá tu conexión o cambiá la URL del GeoJSON.');
  }
}

// Arrancar cuando el DOM esté listo
window.addEventListener('load', () => {
  cargarLimiteCABA();
});
</script>
